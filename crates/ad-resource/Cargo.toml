[package]
name = "ad-resource"
description = "Classic Macintosh resource fork reader and After Dark module decoder."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Intentionally dependency-free: this crate parses untrusted input and must stay
# trivially auditable and fuzzable.
[dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
# This crate reads untrusted resource forks, so every index and every offset
# calculation is a potential panic on malformed input.
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

